
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoàng Tử Giải Cứu Tấm</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,serif;background:#fce8f3;color:#55345e}
button{font-family:inherit;cursor:pointer}
.game{max-width:1050px;margin:auto;padding:12px}
header{text-align:center;background:linear-gradient(120deg,#f7a8ce,#c9a5f5);color:white;border:4px solid white;border-radius:22px;padding:13px;box-shadow:0 4px 12px #9b6a9b55}
h1{font-size:clamp(21px,5vw,34px);margin:3px;text-shadow:2px 3px #a65d9a}
.subtitle{font-size:13px}
.stats{display:flex;justify-content:space-between;gap:7px;flex-wrap:wrap;margin:10px 0}
.stat{background:white;border:2px solid #e8b3d8;border-radius:13px;padding:8px 12px;font-weight:bold}
.scene{height:390px;position:relative;overflow:hidden;border:5px solid white;border-radius:20px;box-shadow:0 5px 15px #80518b55;background:#a9e4d4}
.scene svg{width:100%;height:100%;display:block}
.level-label{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#fff0d9;border:3px solid #e9b4c9;border-radius:16px;padding:9px 16px;text-align:center;min-width:220px;box-shadow:0 3px 7px #74476a55}
.level-label strong{display:block;font-size:19px;color:#8b4e83}
.level-label span{font-size:13px}
.prince{position:absolute;bottom:54px;left:12%;font-size:57px;filter:drop-shadow(2px 4px 2px #5557);transition:left .2s}
.object{position:absolute;bottom:62px;right:19%;font-size:42px;animation:bob 1.5s infinite}
@keyframes bob{50%{transform:translateY(-9px)}}
.ground{position:absolute;bottom:0;width:100%;height:55px;background:linear-gradient(#82c96c,#4e9b55);border-top:5px solid #b9df80}
.controls{display:flex;justify-content:space-between;align-items:center;margin:10px 0;gap:8px}
.move{display:flex;gap:8px}
.control{border:3px solid white;border-radius:50%;width:55px;height:55px;background:#9a70c4;color:white;font-size:25px;box-shadow:0 3px 5px #684a7955}
.panel{background:#fff;border:2px solid #edb8d8;border-radius:17px;padding:13px;margin-top:10px;box-shadow:0 3px 8px #a66c9b22}
.panel h3{margin:0 0 8px;color:#995a91}
.inventory{display:flex;gap:9px;flex-wrap:wrap}
.item{background:#fff0f7;border:2px solid #e7b3d5;border-radius:12px;padding:9px;font-size:25px;min-width:53px;text-align:center}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.action{border:0;border-radius:12px;padding:11px 15px;background:#a879c5;color:white;font-weight:bold}
.action.pink{background:#ed8fba}
.action.gold{background:#e6ad4e;color:#573d25}
.question{font-size:17px;line-height:1.5;color:#533a59}
.answer{display:flex;gap:8px;margin-top:10px}
input{min-width:0;flex:1;border:2px solid #ddb6d6;border-radius:10px;padding:12px;font-size:16px}
.feedback{min-height:25px;font-weight:bold;margin-top:9px}
.hint{background:#fff4ce;border:2px dashed #e6bd64;border-radius:12px;padding:10px;margin-top:10px;display:none;line-height:1.5}
footer{text-align:center;color:#956c91;font-size:12px;padding:15px}
@media(max-width:600px){.scene{height:310px}.level-label{min-width:190px;padding:7px}.level-label strong{font-size:16px}.prince{font-size:48px}.object{font-size:35px}.stat{font-size:12px;padding:7px}.control{width:49px;height:49px}}
</style>
</head>
<body>
<div class="game">
<header>
  <div style="font-size:25px">👑 ✨ 🌸 👑</div>
  <h1>Hoàng Tử Giải Cứu Tấm</h1>
  <div class="subtitle">Một hành trình cổ tích đầy bí mật</div>
</header>

<div class="stats">
  <div class="stat">❤️ <span id="health">100</span>/100</div>
  <div class="stat">⭐ <span id="stars">0</span></div>
  <div class="stat">🏅 <span id="medals">0</span>/5</div>
  <div class="stat">📍 Màn <span id="stageNum">1</span>/5</div>
</div>

<div class="scene" id="scene">
  <svg id="landscape" viewBox="0 0 900 390" preserveAspectRatio="xMidYMid slice"></svg>
  <div class="level-label">
    <strong id="stageTitle">Màn 1: Ngôi làng</strong>
    <span id="stageMission">Tìm chiếc chìa khóa bí mật!</span>
  </div>
  <div class="prince" id="prince">🤴🏻</div>
  <div class="object" id="object">🔑</div>
  <div class="ground"></div>
</div>

<div class="controls">
  <div class="move">
    <button class="control" onclick="move(-1)">⬅</button>
    <button class="control" onclick="move(1)">➡</button>
  </div>
  <button class="action gold" onclick="interact()">✨ Tương tác</button>
  <button class="control" onclick="jump()">⬆</button>
</div>

<div class="panel">
  <h3>🎒 Túi đồ</h3>
  <div class="inventory" id="inventory">
    <div class="item">🌸</div>
  </div>
</div>

<div class="panel">
  <h3>📜 Thử thách của màn</h3>
  <div class="question" id="question"></div>
  <div class="answer">
    <input id="answer" placeholder="Nhập câu trả lời..." autocomplete="off">
    <button class="action pink" onclick="checkAnswer()">Trả lời</button>
  </div>
  <div class="feedback" id="feedback"></div>
  <div class="actions">
    <button class="action gold" onclick="showHint()">💡 Gợi ý</button>
    <button class="action" onclick="resetLevel()">↻ Làm lại màn</button>
  </div>
  <div class="hint" id="hint"></div>
</div>

<div class="panel">
  <h3>📖 Nhật ký hành trình</h3>
  <div id="journal">Hoàng tử bắt đầu chuyến hành trình tìm Tấm...</div>
</div>

<footer>🌷 Chúc bạn có chuyến phiêu lưu thật vui! 🌷</footer>
</div>

<script>
const stages=[
{
 title:"Màn 1: Ngôi làng",mission:"Tìm chiếc chìa khóa bí mật!",
 question:"Một chiếc rương có mã gồm 3 chữ số. Chữ số hàng đơn vị gấp đôi hàng trăm. Hàng chục lớn hơn hàng trăm 1 đơn vị. Tổng 3 chữ số bằng 13. Mã là gì?",
 answers:["256"],hint:["Hãy gọi chữ số hàng trăm là x.","Hai chữ số còn lại lần lượt là x + 1 và 2x."],
 item:"🗝️",object:"🔑",journal:"Hoàng tử tìm thấy chiếc chìa khóa trong ngôi làng.",
 sky:["#9ce3ed","#f8d9a0"],type:0
},
{
 title:"Màn 2: Khu rừng bí ẩn",mission:"Giải mật mã để tìm đường!",
 question:"Tìm số tiếp theo trong dãy: 2, 6, 12, 20, 30, ...",
 answers:["42"],hint:["Hiệu giữa hai số liên tiếp lần lượt là 4, 6, 8, 10.","Hãy tìm hiệu tiếp theo."],
 item:"🌟",object:"🧩",journal:"Hoàng tử vượt qua khu rừng bằng trí thông minh.",
 sky:["#8ccbb4","#c7e8b7"],type:1
},
{
 title:"Màn 3: Nhà mẹ kế",mission:"Tìm manh mối trong căn nhà!",
 question:"Trong một căn phòng có 4 người. Mỗi người bắt tay với tất cả những người còn lại đúng một lần. Có tất cả bao nhiêu cái bắt tay?",
 answers:["6"],hint:["Mỗi người bắt tay với 3 người khác.","Đừng đếm một cái bắt tay hai lần nhé!"],
 item:"📜",object:"🪞",journal:"Hoàng tử tìm được manh mối quan trọng trong căn nhà.",
 sky:["#d9a58b","#f5d2a7"],type:2
},
{
 title:"Màn 4: Cung điện bí mật",mission:"Mở cánh cổng phép thuật!",
 question:"Có 3 chiếc hộp. Chỉ một hộp chứa ngọc. Trên hộp A ghi: 'Ngọc không ở đây'. Hộp B ghi: 'Ngọc ở hộp A'. Hộp C ghi: 'Ngọc không ở hộp B'. Chỉ một câu ghi trên hộp là đúng. Ngọc ở hộp nào?",
 answers:["b","hộp b","hop b"],hint:["Thử lần lượt giả sử ngọc ở A, B hoặc C.","Kiểm tra xem có đúng duy nhất một câu là đúng không."],
 item:"💎",object:"🚪",journal:"Cánh cổng cung điện đã mở!",
 sky:["#9ecdf2","#f3c8ed"],type:3
},
{
 title:"Màn 5: Giải cứu Tấm",mission:"Vượt qua thử thách cuối cùng!",
 question:"Một người đi từ làng đến cung điện. Ngày đầu đi được một nửa quãng đường còn lại và thêm 2 km. Ngày thứ hai đi được một nửa quãng đường còn lại và thêm 2 km. Sau đó còn 4 km. Hỏi quãng đường ban đầu dài bao nhiêu km?",
 answers:["24"],hint:["Làm ngược từ cuối: trước ngày thứ hai còn bao nhiêu km?","Nếu còn 4 km sau khi đi, trước đó người ấy có 2 × (4 + 2) km."],
 item:"💗",object:"🌹",journal:"Tấm đã được giải cứu. Hành trình cổ tích hoàn thành!",
 sky:["#f7b6d5","#b8d9fa"],type:4
}
];

let current=0,position=12,stars=0,medals=0,inventory=["🌸"],hints=0,completed=[];
const $=id=>document.getElementById(id);

function drawScene(type){
 const svg=$("landscape");
 const s=[
 `<rect width="900" height="390" fill="#9ce3ed"/><circle cx="730" cy="65" r="38" fill="#fff0a4"/><path d="M0 220 Q150 100 300 220 T600 210 T900 200 V390 H0" fill="#91c985"/><path d="M0 275 Q200 205 400 280 T900 260 V390 H0" fill="#6cb66b"/><g fill="#f6c3a7" stroke="#9a6657" stroke-width="5"><path d="M65 175 L145 105 L225 175 V285 H65Z"/><path d="M280 190 L350 125 L420 190 V290 H280Z"/></g><g fill="#bd6d78"><path d="M48 178 L145 92 L242 178Z"/><path d="M265 192 L350 112 L435 192Z"/></g><g fill="#fff3d6"><rect x="95" y="210" width="38" height="75"/><rect x="160" y="205" width="38" height="38"/><rect x="320" y="220" width="35" height="65"/></g><g fill="#5b9d58"><circle cx="520" cy="165" r="60"/><circle cx="610" cy="145" r="70"/><circle cx="820" cy="170" r="75"/></g>`,
 `<rect width="900" height="390" fill="#9bcbb7"/><circle cx="740" cy="60" r="32" fill="#fff3b4"/><path d="M0 260 Q150 160 300 260 T600 240 T900 250 V390 H0" fill="#548c65"/><g fill="#28694e"><path d="M30 280 Q40 80 100 45 Q160 100 165 280Z"/><path d="M700 280 Q720 50 800 25 Q880 100 880 280Z"/><path d="M350 280 Q360 100 420 70 Q490 120 490 280Z"/></g><path d="M0 330 Q250 270 430 335 T900 300" stroke="#a6d9ee" stroke-width="38" fill="none"/><g fill="#e8b4ee"><circle cx="240" cy="210" r="22"/><circle cx="600" cy="195" r="25"/><circle cx="540" cy="280" r="17"/></g><g fill="#fff1a9"><circle cx="300" cy="100" r="5"/><circle cx="570" cy="80" r="6"/><circle cx="650" cy="145" r="5"/></g>`,
 `<rect width="900" height="390" fill="#e8b99e"/><rect y="275" width="900" height="115" fill="#b87e63"/><path d="M80 275 V90 H820 V275" fill="#b97968" stroke="#764d50" stroke-width="12"/><path d="M110 90 L450 20 L790 90Z" fill="#87505b"/><g fill="#f9e0ae" stroke="#865e54" stroke-width="7"><rect x="160" y="125" width="100" height="110"/><rect x="640" y="125" width="100" height="110"/></g><g fill="#d58b72"><rect x="385" y="145" width="130" height="130"/><path d="M375 145 L450 75 L525 145Z"/></g><path d="M0 300 H900" stroke="#eac19c" stroke-width="9"/><g fill="#784c48"><rect x="70" y="255" width="760" height="15"/><rect x="100" y="270" width="15" height="65"/><rect x="780" y="270" width="15" height="65"/></g>`,
 `<rect width="900" height="390" fill="#a9d9f6"/><circle cx="740" cy="65" r="35" fill="#fff1b0"/><path d="M0 290 L100 150 L200 290 L300 130 L400 290 L520 150 L650 290 L770 120 L900 290Z" fill="#7cb4d5"/><g fill="#fff0db" stroke="#9b82b9" stroke-width="5"><rect x="250" y="130" width="400" height="180"/><path d="M230 135 L450 25 L670 135Z"/><path d="M300 130 L340 50 L380 130Z"/><path d="M520 130 L560 50 L600 130Z"/></g><path d="M370 310 V190 Q450 105 530 190 V310Z" fill="#8c64b5" stroke="#f7d77e" stroke-width="8"/><path d="M390 280 Q450 170 510 280" fill="none" stroke="#d9b7ff" stroke-width="8"/><g fill="#69aa68"><circle cx="110" cy="270" r="55"/><circle cx="790" cy="270" r="55"/></g>`,
 `<rect width="900" height="390" fill="#f8c5df"/><circle cx="730" cy="60" r="40" fill="#fff4bb"/><path d="M0 275 Q180 210 350 270 T700 255 T900 270 V390 H0" fill="#8ecb8b"/><g fill="#fff2e8" stroke="#d6a5d0" stroke-width="5"><path d="M100 290 V100 H180 V290Z"/><path d="M720 290 V100 H800 V290Z"/><path d="M180 110 Q450 -20 720 110" fill="none" stroke-width="20"/></g><g fill="#f5a5c8"><circle cx="250" cy="180" r="12"/><circle cx="300" cy="235" r="10"/><circle cx="650" cy="180" r="12"/><circle cx="590" cy="240" r="10"/></g><g fill="#6db36c"><circle cx="80" cy="280" r="45"/><circle cx="830" cy="280" r="45"/></g><path d="M0 345 Q450 300 900 345" stroke="#f8e6d5" stroke-width="22" fill="none"/>`
 ];
 svg.innerHTML=s[type]||s[0];
}
function render(){
 const st=stages[current];
 $("stageTitle").textContent=st.title;
 $("stageMission").textContent=st.mission;
 $("question").textContent=st.question;
 $("stageNum").textContent=current+1;
 $("object").textContent=st.object;
 $("object").style.display=completed.includes(current)?"none":"block";
 $("hint").style.display="none";
 $("hint").textContent="";
 $("feedback").textContent="";
 $("answer").value="";
 hints=0;
 drawScene(st.type);
 $("prince").style.left=position+"%";
 $("health").textContent=100;
 $("stars").textContent=stars;
 $("medals").textContent=medals;
 $("inventory").innerHTML=inventory.map(x=>`<div class="item">${x}</div>`).join("");
 $("journal").textContent=st.journal;
}
function move(direction){
 position=Math.max(2,Math.min(88,position+direction*6));
 $("prince").style.left=position+"%";
}
function jump(){
 const p=$("prince");
 p.style.transform="translateY(-55px)";
 setTimeout(()=>p.style.transform="",350);
}
function interact(){
 if(position<55){
  $("feedback").textContent="Tiến lại gần đồ vật ở phía bên phải nhé!";
  return;
 }
 $("feedback").textContent="Bạn đã đến gần vật thể! Hãy giải câu đố để tiếp tục.";
 $("answer").focus();
}
function showHint(){
 const st=stages[current];
 if(hints>=st.hint.length){
  $("hint").textContent="Bạn đã xem hết gợi ý của màn này. Hãy thử tự suy luận nhé!";
 }else{
  $("hint").textContent="Gợi ý "+(hints+1)+": "+st.hint[hints];
  hints++;
 }
 $("hint").style.display="block";
}
function checkAnswer(){
 const value=$("answer").value.trim().toLowerCase().replace(/\s+/g," ");
 if(!value){$("feedback").textContent="Nhập câu trả lời trước nhé!";return;}
 const st=stages[current];
 if(st.answers.includes(value)){
  if(!completed.includes(current)){
   completed.push(current);stars+=10;medals++;
   inventory.push(st.item);
  }
  $("feedback").textContent="🎉 Chính xác! Bạn đã vượt qua màn này!";
  $("object").style.display="none";
  $("stars").textContent=stars;
  $("medals").textContent=medals;
  $("inventory").innerHTML=inventory.map(x=>`<div class="item">${x}</div>`).join("");
  localStorage.setItem("princeGame",JSON.stringify({current,stars,medals,inventory,completed}));
  setTimeout(()=>{
   if(current<4){
    current++;position=12;render();
   }else{
    $("question").textContent="🌸 Chúc mừng! Bạn đã giải cứu được Tấm và hoàn thành hành trình!";
    $("answer").style.display="none";
    $("object").textContent="💗";
    $("object").style.display="block";
    $("journal").textContent="Bạn đã hoàn thành cả 5 màn chơi. Cảm ơn bạn đã tham gia!";
    $("feedback").textContent="🏆 CHIẾN THẮNG!";
   }
  },1400);
 }else{
  $("feedback").textContent="Chưa chính xác! Hãy suy nghĩ thêm nhé. 💭";
 }
}
function resetLevel(){
 completed=completed.filter(x=>x!==current);
 render();
 $("feedback").textContent="Đã đặt lại thử thách của màn này.";
}
$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")checkAnswer()});
const saved=localStorage.getItem("princeGame");
if(saved){
 try{
  const data=JSON.parse(saved);
  current=Math.min(data.current||0,4);
  stars=data.stars||0;medals=data.medals||0;
  inventory=data.inventory||["🌸"];
  completed=data.completed||[];
 }catch(e){}
}
render();
</script>
</body>
</html>
