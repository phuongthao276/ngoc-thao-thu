
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hoàng Tử Giải Cứu Tấm</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#fff0f6;color:#75445c;
 font-family:Arial,sans-serif;text-align:center;
}
header{
 padding:15px;background:#ffc9df;
 border-bottom:4px solid #fff;
}
h1{font-size:clamp(22px,5vw,32px);margin:4px}
#hud{
 display:flex;justify-content:center;gap:12px;
 flex-wrap:wrap;padding:12px;background:#fff8fb;
 font-weight:bold;
}
.pill{background:white;border-radius:20px;padding:8px 13px}
#mission{
 margin:12px auto;padding:12px;width:94%;
 max-width:900px;background:white;border-radius:16px;
}
#scene{
 position:relative;width:94%;max-width:900px;
 margin:auto;overflow:hidden;border:5px solid white;
 border-radius:22px;box-shadow:0 5px 15px #d9a6bd;
 background:#bceaff;
}
svg{display:block;width:100%;height:auto}
#prince{
 position:absolute;width:11%;min-width:54px;max-width:90px;
 bottom:19%;left:12%;transition:left .18s;
 z-index:5;pointer-events:none;
}
#prince svg{width:100%;filter:drop-shadow(0 3px 2px #7775)}
#target{
 position:absolute;left:72%;bottom:28%;
 font-size:clamp(25px,5vw,43px);cursor:pointer;
 filter:drop-shadow(0 3px 2px #777);
 animation:bob 1.4s infinite ease-in-out;
}
@keyframes bob{50%{transform:translateY(-9px)}}
#controls{
 display:flex;justify-content:center;gap:10px;
 flex-wrap:wrap;padding:15px;
}
button{
 border:0;border-radius:16px;padding:12px 17px;
 color:#71415a;background:#ffc0d8;font-weight:bold;
 font-size:15px;box-shadow:0 4px #e69ab9;
 cursor:pointer;
}
button:active{transform:translateY(3px);box-shadow:none}
.purple{background:#d9c7ff;box-shadow:0 4px #b7a1e9}
.panel{
 background:white;border-radius:18px;
 max-width:850px;width:94%;margin:8px auto;padding:15px;
}
#inventory{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.item{background:#fff0f6;padding:9px;border-radius:12px}
#popup{
 display:none;position:fixed;inset:0;z-index:20;
 background:#51344ebd;align-items:center;justify-content:center;
 padding:15px;
}
#popup .panel{max-width:480px}
.choice{display:block;width:100%;margin:9px 0}
#message{min-height:25px;font-weight:bold}
small{color:#a77d92}
@media(max-width:500px){
 #scene{border-width:3px}
 button{padding:12px}
}
</style>
</head>
<body>
<header>
 <h1>👑 HOÀNG TỬ GIẢI CỨU TẤM 🌸</h1>
 <div>Hành trình cổ tích diệu kỳ</div>
</header>

<div id="hud">
 <span class="pill">❤️ Năng lượng: <b id="hp">100</b></span>
 <span class="pill">⭐ Sao: <b id="stars">0</b></span>
 <span class="pill">🏅 Huy hiệu: <b id="badges">0/5</b></span>
</div>

<div id="mission">
 <b id="stageName">MÀN 1 — NGÔI LÀNG</b>
 <p id="task">Hãy tìm chiếc chìa khóa bí mật!</p>
</div>

<div id="scene">
<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="sky" x2="0" y2="1">
  <stop stop-color="#80d5f7"/><stop offset="1" stop-color="#e1f8ff"/>
 </linearGradient>
 <linearGradient id="grass" x2="0" y2="1">
  <stop stop-color="#a8e58c"/><stop offset="1" stop-color="#54b978"/>
 </linearGradient>
 <linearGradient id="roof" x2="0" y2="1">
  <stop stop-color="#f6a0a0"/><stop offset="1" stop-color="#d96f7c"/>
 </linearGradient>
</defs>
<!-- bầu trời -->
<rect width="900" height="440" fill="url(#sky)"/>
<circle cx="750" cy="75" r="42" fill="#ffe58b"/>
<g fill="#fff" opacity=".9">
 <ellipse cx="145" cy="82" rx="55" ry="18"/>
 <ellipse cx="175" cy="72" rx="35" ry="24"/>
 <ellipse cx="520" cy="105" rx="60" ry="18"/>
 <ellipse cx="550" cy="93" rx="32" ry="24"/>
</g>
<!-- núi xa -->
<path d="M0 265 L130 105 260 265 390 130 550 275 700 125 900 270 V440 H0Z" fill="#9cccae"/>
<path d="M95 150 L130 105 165 150 140 142 130 151 118 140Z" fill="white"/>
<path d="M355 172 L390 130 430 173 400 162 390 174 380 161Z" fill="white"/>
<path d="M660 168 L700 125 745 170 712 157 700 170 687 156Z" fill="white"/>
<!-- đồng cỏ -->
<path d="M0 260 Q250 230 470 265 T900 250 V440 H0Z" fill="url(#grass)"/>
<path d="M0 335 Q230 300 450 345 T900 320" fill="none" stroke="#d6f5a7" stroke-width="8"/>
<!-- đường đi -->
<path d="M250 440 Q390 320 590 350 Q700 370 790 440Z" fill="#e8c99b"/>
<!-- nhà -->
<g id="villageHouse">
 <rect x="365" y="205" width="185" height="130" rx="8" fill="#ffe1b5" stroke="#b97863" stroke-width="5"/>
 <path d="M340 215 L455 125 575 215Z" fill="url(#roof)" stroke="#b96d77" stroke-width="6"/>
 <rect x="430" y="260" width="55" height="75" rx="25" fill="#a86b59"/>
 <rect x="390" y="230" width="30" height="35" fill="#a8e6ff" stroke="#a86b59" stroke-width="4"/>
 <rect x="500" y="230" width="30" height="35" fill="#a8e6ff" stroke="#a86b59" stroke-width="4"/>
</g>
<!-- cây -->
<g>
 <rect x="95" y="220" width="25" height="100" fill="#986344"/>
 <circle cx="105" cy="190" r="57" fill="#54ad71"/>
 <circle cx="65" cy="218" r="38" fill="#69c27d"/>
 <circle cx="145" cy="220" r="42" fill="#70cb81"/>
 <rect x="760" y="235" width="25" height="90" fill="#986344"/>
 <circle cx="770" cy="195" r="55" fill="#4ca96d"/>
 <circle cx="730" cy="220" r="40" fill="#72c981"/>
 <circle cx="810" cy="222" r="38" fill="#69bd78"/>
</g>
<!-- hoa nhỏ -->
<g fill="#ffec9e">
 <circle cx="230" cy="355" r="5"/><circle cx="250" cy="380" r="5"/>
 <circle cx="650" cy="365" r="5"/><circle cx="680" cy="390" r="5"/>
</g>
<g fill="#ffb6d0">
 <circle cx="220" cy="355" r="3"/><circle cx="640" cy="365" r="3"/>
</g>
</svg>

<!-- Hoàng tử được vẽ bằng SVG -->
<div id="prince">
<svg viewBox="0 0 120 170" xmlns="http://www.w3.org/2000/svg">
<!-- áo choàng -->
<path d="M28 88 Q5 112 13 163 L105 163 Q112 112 88 88Z" fill="#d94b63" stroke="#9c304c" stroke-width="4"/>
<path d="M42 100 L60 155 78 100" fill="#ffe2b1"/>
<!-- chân -->
<path d="M40 145 L37 165 M78 145 L83 165" stroke="#694c5a" stroke-width="11" stroke-linecap="round"/>
<!-- thân -->
<path d="M31 82 Q60 65 89 82 L91 125 Q60 142 29 125Z" fill="#f5d7a6" stroke="#a87961" stroke-width="3"/>
<!-- cổ áo -->
<path d="M42 78 L60 102 78 78" fill="#fff3db"/>
<!-- mặt -->
<ellipse cx="60" cy="51" rx="36" ry="38" fill="#ffd7b5" stroke="#9b6b57" stroke-width="3"/>
<!-- tóc -->
<path d="M25 48 Q18 3 60 12 Q102 8 96 54 Q80 29 63 32 Q42 25 25 48" fill="#654333"/>
<path d="M25 42 Q10 52 26 64" fill="#654333"/>
<!-- mắt -->
<ellipse cx="47" cy="55" rx="4" ry="6" fill="#493c3b"/>
<ellipse cx="73" cy="55" rx="4" ry="6" fill="#493c3b"/>
<circle cx="48" cy="53" r="1.5" fill="white"/>
<circle cx="74" cy="53" r="1.5" fill="white"/>
<path d="M53 70 Q60 77 68 70" fill="none" stroke="#c36e75" stroke-width="3" stroke-linecap="round"/>
<circle cx="35" cy="68" r="6" fill="#f5a4a2" opacity=".6"/>
<circle cx="85" cy="68" r="6" fill="#f5a4a2" opacity=".6"/>
<!-- vương miện -->
<path d="M31 24 L25 0 45 14 60 0 76 14 96 0 89 27Z" fill="#ffd84f" stroke="#d69c29" stroke-width="3"/>
<circle cx="60" cy="15" r="5" fill="#ff7eae"/>
<!-- tay -->
<path d="M32 91 Q12 92 17 115" stroke="#ffd7b5" stroke-width="12" fill="none" stroke-linecap="round"/>
<path d="M87 91 Q108 92 103 115" stroke="#ffd7b5" stroke-width="12" fill="none" stroke-linecap="round"/>
</svg>
</div>
<div id="target" onclick="collect()">🔑</div>
</div>

<div id="controls">
 <button onclick="move(-7)">⬅️ Trái</button>
 <button onclick="move(7)">Phải ➡️</button>
 <button class="purple" onclick="explore()">🔍 Khám phá</button>
</div>

<div class="panel">
 <h3>🎒 Túi đồ</h3>
 <div id="inventory"><span class="item">Chưa có vật phẩm</span></div>
 <hr>
 <button onclick="journal()">📖 Nhật ký</button>
 <button onclick="hint()" class="purple">💡 Gợi ý</button>
 <button onclick="restart()">🔄 Chơi lại</button>
 <p><small>Dùng phím ← → trên máy tính hoặc nút trên màn hình điện thoại.</small></p>
</div>

<div id="popup">
 <div class="panel">
  <h2 id="qtitle">Câu đố</h2>
  <p id="question"></p>
  <div id="choices"></div>
  <div id="message"></div>
  <button onclick="closePopup()">Đóng</button>
 </div>
</div>

<script>
const levels=[
 {name:"MÀN 1 — NGÔI LÀNG",task:"Tìm chiếc chìa khóa được giấu trong ngôi làng.",
 q:"Người dân nói chìa khóa nằm ở nơi có nhiều hoa. Em hãy chọn nơi cần tìm.",
 a:["🌳 Gốc cây","🌷 Vườn hoa","🏡 Trong nhà"],c:1,
 hint:"Hãy tìm ở nơi có những bông hoa nhé!",item:"🔑 Chìa khóa"},
 {name:"MÀN 2 — RỪNG BÍ ẨN",task:"Tìm con đường đúng để vượt qua khu rừng.",
 q:"Dãy số trên tấm bia là 2, 4, 6, 8, ... Số tiếp theo là?",
 a:["9","10","12"],c:1,
 hint:"Mỗi số tăng thêm 2.",item:"🗺️ Bản đồ"},
 {name:"MÀN 3 — NHÀ DÌ GHẺ",task:"Tìm manh mối trong căn nhà cũ.",
 q:"Vật nào có thể phản chiếu hình ảnh của hoàng tử?",
 a:["🪞 Gương","🧺 Giỏ","📜 Cuộn giấy"],c:0,
 hint:"Vật này thường được treo trên tường.",item:"🪞 Gương"},
 {name:"MÀN 4 — CUNG ĐIỆN",task:"Giải câu đố để mở cánh cổng hoàng cung.",
 q:"Có 3 chiếc chìa khóa. Chỉ một chiếc mở được cổng. Manh mối nói chìa khóa đúng có màu vàng. Em chọn?",
 a:["🔵 Xanh","🟡 Vàng","🔴 Đỏ"],c:1,
 hint:"Đọc kỹ manh mối về màu sắc.",item:"💎 Viên ngọc"},
 {name:"MÀN 5 — GIẢI CỨU TẤM",task:"Hoàn thành thử thách cuối cùng để gặp Tấm.",
 q:"Tấm có 3 quả táo, cho đi 1 quả rồi được tặng thêm 2 quả. Tấm còn bao nhiêu?",
 a:["3 quả","4 quả","5 quả"],c:2,
 hint:"Tính 3 - 1 + 2 nhé!",item:"👑 Huy hiệu hoàng gia"}
];
let level=0,pos=12,hp=100,stars=0,items=[],done=[],notes=[];
let collected=false;
const $=id=>document.getElementById(id);

function save(){
 localStorage.setItem("tamChibiSave",JSON.stringify({level,pos,hp,stars,items,done,notes,collected}));
}
function load(){
 try{
  const d=JSON.parse(localStorage.getItem("tamChibiSave"));
  if(d){level=d.level||0;pos=d.pos||12;hp=d.hp??100;stars=d.stars||0;
   items=d.items||[];done=d.done||[];notes=d.notes||[];collected=d.collected||false;}
 }catch(e){}
}
function update(){
 $("hp").textContent=hp;
 $("stars").textContent=stars;
 $("badges").textContent=done.length+"/5";
 $("stageName").textContent=levels[level].name;
 $("task").textContent=levels[level].task;
 $("prince").style.left=pos+"%";
 $("target").style.display=(level===0&&!collected)?"block":"none";
 $("inventory").innerHTML=items.length?items.map(x=>'<span class="item">'+x+'</span>').join(""):'<span class="item">Chưa có vật phẩm</span>';
 save();
}
function move(n){
 pos=Math.max(2,Math.min(87,pos+n));
 update();
}
function collect(){
 if(level!==0||collected)return;
 collected=true;items.push("🔑 Chìa khóa");stars++;
 notes.push("Đã tìm thấy chìa khóa trong ngôi làng.");
 $("message").textContent="Bạn đã tìm thấy chìa khóa!";
 update();
}
function explore(){
 if(level===0&&!collected){
  alert("Hãy chạm vào chiếc chìa khóa trong cảnh vật trước nhé!");
  return;
 }
 openQuestion();
}
function openQuestion(){
 const s=levels[level];
 $("qtitle").textContent=s.name;
 $("question").textContent=s.q;
 $("message").textContent="";
 $("choices").innerHTML="";
 s.a.forEach((a,i)=>{
  const b=document.createElement("button");
  b.className="choice";b.textContent=a;
  b.onclick=()=>answer(i);
  $("choices").appendChild(b);
 });
 $("popup").style.display="flex";
}
function answer(i){
 if(i===levels[level].c){
  stars+=2;
  hp=Math.min(100,hp+10);
  if(!items.includes(levels[level].item))items.push(levels[level].item);
  if(!done.includes(level))done.push(level);
  notes.push("Hoàn thành "+levels[level].name+".");
  $("message").textContent="🎉 Chính xác! Bạn đã vượt qua thử thách!";
  $("choices").innerHTML='<button class="choice" onclick="nextLevel()">Đi tiếp ➜</button>';
  update();
 }else{
  hp=Math.max(0,hp-5);
  $("hp").textContent=hp;
  $("message").textContent="Chưa đúng rồi, thử lại nhé!";
  save();
 }
}
function nextLevel(){
 $("popup").style.display="none";
 if(level===4){ending();return;}
 level++;pos=12;collected=false;
 $("target").textContent=["🔑","🗺️","🪞","💎","👸🏻"][level];
 update();
}
function closePopup(){$("popup").style.display="none";}
function hint(){alert("💡 "+levels[level].hint);}
function journal(){alert("📖 NHẬT KÝ\n\n"+(notes.join("\n")||"Chưa có ghi chép."));}
function restart(){
 if(confirm("Chơi lại từ đầu?")){
  localStorage.removeItem("tamChibiSave");
  location.reload();
 }
}
function ending(){
 $("mission").innerHTML="<h2>🎉 BẠN ĐÃ GIẢI CỨU ĐƯỢC TẤM!</h2><p>Hoàng tử và Tấm đã đoàn tụ. Câu chuyện có một kết thúc thật đẹp!</p>";
 $("scene").innerHTML='<svg viewBox="0 0 900 440"><rect width="900" height="440" fill="#bceaff"/><circle cx="750" cy="70" r="45" fill="#ffe58b"/><path d="M0 290 Q450 200 900 290 V440 H0" fill="#83d28b"/><text x="450" y="170" text-anchor="middle" font-size="90">🏰</text><text x="450" y="290" text-anchor="middle" font-size="95">🤴🏻 💗 👸🏻</text><text x="450" y="370" text-anchor="middle" font-size="38" fill="#9b4770" font-weight="bold">HAPPY ENDING!</text></svg>';
 $("controls").style.display="none";
}
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")move(-4);
 if(e.key==="ArrowRight")move(4);
});
load();
if(done.includes(0))collected=true;
update();
if(level===4&&done.includes(4))ending();
</script>
</body>
</html>
